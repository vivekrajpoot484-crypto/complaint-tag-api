<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complaint Classifier</title>

<style>
body {
    font-family: Arial;
    background: #f5f7fa;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.container {
    background: white;
    padding: 20px;
    width: 500px;
    border-radius: 10px;
}
textarea {
    width: 100%;
    height: 120px;
}
button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
}
#output {
    margin-top: 20px;
    display: none;
}
.error { color: red; }
.loading { color: blue; }
</style>
</head>

<body>

<div class="container">
    <h2>Complaint Classifier</h2>

    <textarea id="message" placeholder="Enter complaint..."></textarea>
    <button id="analyzeBtn">Analyze</button>

    <div id="status"></div>

    <div id="output">
        <p><b>Category:</b> <span id="res-category"></span></p>
        <p><b>Urgency:</b> <span id="res-urgency"></span></p>
        <p><b>Tone:</b> <span id="res-tone"></span></p>
        <p><b>Confidence:</b> <span id="res-confidence"></span></p>
        <p><b>Summary:</b> <span id="res-summary"></span></p>
    </div>
</div>

<script>
const btn = document.getElementById('analyzeBtn');

btn.addEventListener('click', async () => {
    const message = document.getElementById('message').value.trim();
    const status = document.getElementById('status');
    const output = document.getElementById('output');

    if (!message) {
        alert("Enter message");
        return;
    }

    status.innerHTML = '<span class="loading">Analyzing...</span>';
    output.style.display = "none";

    try {
        // TODO: Replace with actual Render URL after deployment
        const response = await fetch('https://your-app.onrender.com/api/tag-complaint', {
            method: 'POST',

            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message })
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.error);

        document.getElementById('res-category').textContent = data.category;
        document.getElementById('res-urgency').textContent = data.urgency_score;
        document.getElementById('res-tone').textContent = data.reply_tone;
        document.getElementById('res-confidence').textContent = data.confidence;
        document.getElementById('res-summary').textContent = data.summary;

        status.innerHTML = '';
        output.style.display = "block";

    } catch (err) {
        status.innerHTML = `<span class="error">${err.message}</span>`;
    }
});
</script>

</body>
</html>
